<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff6ea" />
  <meta name="description" content="四科自考客观题刷题器：全量无限循环 + 随机组卷刷卷，maimai DX 风格结算。" />
  <title>刷题 DX · 四科客观题</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff7a3d'/%3E%3Ctext x='32' y='44' font-size='30' font-weight='900' text-anchor='middle' fill='white' font-family='sans-serif'%3EDX%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/base.css?v=20261121e" />
  <link rel="stylesheet" href="css/result.css?v=20261121e" />
  <link rel="stylesheet" href="css/theme-neu.css?v=20261121e" />
  <script src="js/config.js?v=20261121e"></script>
</head>
<body>
  <div class="bg-deco" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/home" aria-label="回到首页">
      <span class="brand-dx">DX</span>
      <span>
        <span class="brand-name">刷题</span>
        <small>STUDY DELUXE</small>
      </span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#/home" data-nav="home" data-icon="🏠"><span class="nav-text">首页</span></a>
      <a href="#/wrong" data-nav="wrong" data-icon="📕"><span class="nav-text">错题本</span><b id="nav-wrong-count" class="hidden">0</b></a>
      <a href="#/stats" data-nav="stats" data-icon="📈"><span class="nav-text">战绩</span></a>
    </nav>
    <div class="top-right">
      <button id="conn-chip" class="chip" type="button" title="服务端连接状态">
        <span class="dot"></span><span id="conn-text">连接中…</span>
      </button>
      <button id="nick-btn" class="chip nick" type="button" title="修改昵称">
        <span>👤</span><span id="nick-text">学员</span>
      </button>
    </div>
  </header>

  <main id="main">
    <section id="view-home" class="view"></section>
    <section id="view-setup" class="view"></section>
    <section id="view-play" class="view"></section>
    <section id="view-result" class="view"></section>
    <section id="view-wrong" class="view"></section>
    <section id="view-stats" class="view"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=20261121e"></script>
</body>
</html>
